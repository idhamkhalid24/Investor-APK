<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Investor Portal - Rocky Hijab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
  
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="info-modal" class="modal-overlay" style="display:none;" onclick="closeInfo()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="flex-between" style="border-bottom:var(--b-width) solid #000; padding-bottom:12px; margin-bottom:12px;">
        <h3 id="info-title" style="margin:0; font-size:1.15rem; font-weight:800;">Info</h3>
        <button class="btn" style="padding:0.25rem 0.5rem;" onclick="closeInfo()"><i class="fas fa-xmark"></i></button>
      </div>
      <div id="info-body" style="font-size:0.9rem; line-height:1.5; font-weight:600;"></div>
    </div>
  </div>

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-QZZUlxu3GpoxkPHt"></script>
